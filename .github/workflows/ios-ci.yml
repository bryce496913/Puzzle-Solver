name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PROJECT: Puzzle Solver.xcodeproj
      SCHEME: Puzzle Solver
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -list

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Select an available iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          simulator_data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )

          candidates = []
          for runtime, devices in simulator_data["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.groups()))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iOS Simulator was found")

          version, name, udid = max(candidates)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"destination=platform=iOS Simulator,id={udid}\n")
          print(f"Selected {name} running iOS {'.'.join(map(str, version))} ({udid})")
          PY

      - name: Build application (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:'Puzzle SolverTests' \
            test

      - name: Build application (Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test diagnostics
        if: ${{ always() && hashFiles('TestResults.xcresult/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
