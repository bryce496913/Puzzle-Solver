name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    # Stable name for the branch-protection required status check.
    name: V1 Release Gate
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: Puzzle Solver.xcodeproj
      SCHEME: Puzzle Solver
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/ { split($2, version, "."); print version[1] }')"
          if [[ -z "$xcode_major" || "$xcode_major" -lt 26 ]]; then
            echo "Xcode 26 or later is required; found: $(xcodebuild -version | head -n 1)" >&2
            exit 1
          fi
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -list

      - name: Verify iOS-only app configurations
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$configuration" \
              -showBuildSettings -json > "$RUNNER_TEMP/puzzle-settings-$configuration.json"
          done
          python3 <<'PYTHON'
          import json
          import os
          from pathlib import Path

          for configuration in ("Debug", "Release"):
              path = Path(os.environ["RUNNER_TEMP"]) / f"puzzle-settings-{configuration}.json"
              targets = json.loads(path.read_text())
              apps = [target for target in targets if target["target"] == "Puzzle Solver"]
              if len(apps) != 1:
                  raise SystemExit(f"{configuration}: expected exactly one Puzzle Solver app target")
              settings = apps[0]["buildSettings"]
              if set(settings.get("SUPPORTED_PLATFORMS", "").split()) != {"iphoneos", "iphonesimulator"}:
                  raise SystemExit(f"{configuration}: the app must target only iOS device and simulator")
              for key in ("SUPPORTS_MACCATALYST", "SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD", "SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD"):
                  if settings.get(key) != "NO":
                      raise SystemExit(f"{configuration}: {key} must remain NO")
              if settings.get("TARGETED_DEVICE_FAMILY") != "1":
                  raise SystemExit(f"{configuration}: V1 must retain its iPhone device family")
              print(f"{configuration}: verified iPhone/iOS-only app settings")
          PYTHON

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Select an available iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          simulator_data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )

          candidates = []
          for runtime, devices in simulator_data["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = tuple(map(int, match.groups()))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iOS Simulator was found")

          version, name, udid = max(candidates)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"destination=platform=iOS Simulator,id={udid}\n")
              output.write(f"udid={udid}\n")
          print(f"Selected {name} running iOS {'.'.join(map(str, version))} ({udid})")
          PY

      - name: Build application (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:'Puzzle SolverTests' \
            test

      - name: Run V1 XCUITests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:'Puzzle SolverUITests' \
            test

      - name: Build application (Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate unsigned Release device archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$RUNNER_TEMP/PuzzleSolver.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Collect UI-test screenshots and logs
        if: ${{ failure() }}
        run: |
          mkdir -p UITestDiagnostics
          xcrun simctl io '${{ steps.simulator.outputs.udid }}' screenshot UITestDiagnostics/final-simulator.png 2>/dev/null || true
          xcrun simctl spawn '${{ steps.simulator.outputs.udid }}' log show --last 15m --style compact > UITestDiagnostics/simulator.log 2>&1 || true

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v1-test-diagnostics
          path: |
            UnitTestResults.xcresult
            UITestResults.xcresult
            UITestDiagnostics
          if-no-files-found: ignore
          retention-days: 14
